<div class="container">
  <div class="left-section">
    <div class="formulario-container">
      <h1>{{ usuarioEditando ? 'Editar Usuário' : 'Formulário de cadastro' }}</h1>
      
      <div *ngIf="mensagem" [ngClass]="{'mensagem-sucesso': tipoMensagem === 'sucesso', 'mensagem-erro': tipoMensagem === 'erro'}" class="mensagem">
        {{ mensagem }}
      </div>

      <form (ngSubmit)="cadastrarOuAtualizarUsuario()">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input 
            type="text" 
            id="nome" 
            [(ngModel)]="formulario.nome" 
            name="nome"
            placeholder="Digite seu nome"
            required
          />
        </div>

        <div class="form-group">
          <label for="idade">Idade:</label>
          <input 
            type="number" 
            id="idade" 
            [(ngModel)]="formulario.idade" 
            name="idade"
            placeholder="Digite sua idade"
            min="1"
            max="120"
            required
          />
        </div>

        <div class="form-group">
          <label for="cep">CEP:</label>
          <div class="cep-container">
            <input 
              type="text" 
              id="cep" 
              [(ngModel)]="formulario.cep" 
              name="cep"
              placeholder="Digite seu CEP"
              (blur)="buscarCep()"
              maxlength="9"
              required
            />
            <button type="button" (click)="buscarCep()" [disabled]="cepCarregando" class="btn-buscar">
              {{ cepCarregando ? 'Buscando...' : 'Buscar' }}
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço:</label>
          <input 
            type="text" 
            id="endereco" 
            [(ngModel)]="formulario.endereco" 
            name="endereco"
            placeholder="Endereço (preenchido automaticamente)"
            readonly
            required
          />
        </div>

        <div class="form-group">
          <label for="complemento">Complemento:</label>
          <input 
            type="text" 
            id="complemento" 
            [(ngModel)]="formulario.complemento" 
            name="complemento"
            placeholder="Apartamento, bloco, etc (opcional)"
          />
        </div>

        <div class="button-group">
          <button type="submit" [ngClass]="usuarioEditando ? 'btn-atualizar' : 'btn-cadastrar'">
            {{ usuarioEditando ? 'Atualizar' : 'Cadastrar' }}
          </button>
          <button *ngIf="usuarioEditando" type="button" (click)="cancelarEdicao()" class="btn-cancelar">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="right-section">
    <div class="usuarios-container">
      <h1>Usuários cadastrados</h1>
      
      <div *ngIf="usuarios.length === 0" class="vazio">
        <p>Nenhum usuário cadastrado ainda</p>
      </div>

      <div *ngIf="usuarios.length > 0" class="usuarios-list">
        <div *ngFor="let usuario of usuarios" class="usuario-card">
          <div class="usuario-info">
            <h3>{{ usuario.nome }}</h3>
            <p><strong>Idade:</strong> {{ usuario.idade }}</p>
            <p><strong>CEP:</strong> {{ usuario.cep }}</p>
            <p><strong>Endereço:</strong> {{ usuario.endereco }}</p>
            <p *ngIf="usuario.complemento"><strong>Complemento:</strong> {{ usuario.complemento }}</p>
          </div>
          <div class="button-actions">
            <button (click)="editarUsuario(usuario)" class="btn-editar">Editar</button>
            <button (click)="deletarUsuario(usuario.id)" class="btn-deletar">Deletar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
